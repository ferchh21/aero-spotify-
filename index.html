<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AeroPlayer — Frutiger Aero Spotify</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #0077be 0%, #38b6ff 45%, #7ed957 82%, #4caf50 100%);
      overflow: hidden;
      color: #0b2e46;
      padding: 16px;
    }

    .bubbles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bubble {
      position: absolute;
      bottom: -80px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.15) 60%, rgba(0, 210, 255, 0.4));
      box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.8), 0 4px 12px rgba(0, 80, 140, 0.2);
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      15% { opacity: 0.85; }
      100% { transform: translateY(-115vh) scale(1.15); opacity: 0; }
    }

    .aero-window {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.72) 0%, rgba(220, 245, 255, 0.55) 50%, rgba(190, 235, 255, 0.65) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 22px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 45px rgba(0, 55, 100, 0.35), inset 0 1px 2px rgba(255, 255, 255, 1);
      padding: 18px;
      overflow: hidden;
    }

    .aero-window::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 42%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 20px 20px 50% 50% / 20px 20px 18px 18px;
      pointer-events: none;
    }

    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    .title-text {
      font-weight: 700;
      font-size: 15px;
      color: #06395c;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9e9e9e;
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), 0 0 6px rgba(0,0,0,0.2);
    }
    .status-dot.connected {
      background: radial-gradient(circle at 35% 35%, #b9ff66, #38b000);
      box-shadow: 0 0 8px #52d600;
    }

    .aero-btn {
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      background: linear-gradient(180deg, #ffffff 0%, #c2ecff 48%, #7cd4ff 52%, #b8ebff 100%);
      box-shadow: 0 4px 10px rgba(0, 90, 150, 0.25), inset 0 1px 1px #ffffff;
      color: #05385b;
      font-weight: 700;
      transition: transform 0.12s ease, filter 0.15s ease;
    }
    .aero-btn:active {
      transform: scale(0.95);
      filter: brightness(0.95);
    }

    .login-btn {
      padding: 6px 14px;
      font-size: 12px;
    }

    .album-frame {
      position: relative;
      z-index: 2;
      width: 220px;
      height: 220px;
      margin: 6px auto 16px;
      border-radius: 18px;
      padding: 8px;
      background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(180,235,255,0.5));
      box-shadow: 0 12px 24px rgba(0, 65, 115, 0.28), inset 0 1px 2px #fff;
      border: 1px solid rgba(255,255,255,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .album-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      background: radial-gradient(circle at 30% 30%, #a8ebff, #0088cc 65%, #004e7a 100%);
      box-shadow: inset 0 2px 10px rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 4px 12px rgba(0,50,100,0.4);
    }
    .album-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      display: none;
    }

    .track-info {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-bottom: 16px;
    }
    .track-title {
      font-size: 19px;
      font-weight: 800;
      color: #042c47;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 14px;
      font-weight: 600;
      color: #165b85;
      margin-top: 3px;
    }

    .progress-wrap {
      position: relative;
      z-index: 2;
      margin-bottom: 18px;
    }
    .progress-bar {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: inset 0 2px 4px rgba(0, 60, 110, 0.25);
      overflow: hidden;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(180deg, #b8ff70 0%, #52d600 50%, #3aa800 51%, #7ae82e 100%);
      box-shadow: 0 0 8px rgba(82, 214, 0, 0.7);
      transition: width 0.25s linear;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #0e4a70;
      margin-top: 5px;
    }

    .controls {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-bottom: 14px;
    }
    .ctrl-btn {
      width: 46px;
      height: 46px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-orb {
      width: 64px;
      height: 64px;
      font-size: 24px;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 60, 120, 0.6);
      background: linear-gradient(180deg, #8ce3ff 0%, #1ea7fd 49%, #0077e6 51%, #38c6ff 100%);
      box-shadow: 0 6px 16px rgba(0, 110, 220, 0.45), inset 0 2px 3px rgba(255, 255, 255, 0.95);
    }

    .hint-box {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 12px;
      color: #083d61;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="bubbles" id="bubbles"></div>

  <div class="aero-window">
    <div class="title-bar">
      <div class="title-text">
        <span class="status-dot" id="statusDot"></span>
        <span>AeroPlayer 2007</span>
      </div>
      <button class="aero-btn login-btn" id="authBtn">Connect Spotify</button>
    </div>

    <div class="album-frame">
      <div class="album-placeholder" id="albumPlaceholder">♫</div>
      <img id="albumArt" alt="Album Art" />
    </div>

    <div class="track-info">
      <div class="track-title" id="trackTitle">Ready to Connect</div>
      <div class="track-artist" id="trackArtist">Tap "Connect Spotify" above</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="curTime">0:00</span>
        <span id="durTime">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="aero-btn ctrl-btn" id="prevBtn" title="Previous">⏮</button>
      <button class="aero-btn ctrl-btn play-orb" id="playBtn" title="Play/Pause">▶</button>
      <button class="aero-btn ctrl-btn" id="nextBtn" title="Next">⏭</button>
    </div>

    <div class="hint-box" id="statusMsg">
      After connecting, open the official Spotify app, tap the <b>Devices icon</b>, and pick <b>"Frutiger Aero Player"</b>.
    </div>
  </div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
    const CLIENT_ID = "YOUR_CLIENT_ID_HERE";

    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = "streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state";

    const bubbleContainer = document.getElementById("bubbles");
    for (let i = 0; i < 18; i++) {
      const b = document.createElement("div");
      b.className = "bubble";
      const size = Math.random() * 45 + 14;
      b.style.width = size + "px";
      b.style.height = size + "px";
      b.style.left = Math.random() * 100 + "vw";
      b.style.animationDuration = Math.random() * 10 + 8 + "s";
      b.style.animationDelay = Math.random() * 8 + "s";
      bubbleContainer.appendChild(b);
    }

    function generateRandomString(length) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      const values = crypto.getRandomValues(new Uint8Array(length));
      return values.reduce((acc, x) => acc + chars[x % chars.length], "");
    }

    async function sha256(plain) {
      const encoder = new TextEncoder();
      const data = encoder.encode(plain);
      return window.crypto.subtle.digest("SHA-256", data);
    }

    function base64encode(input) {
      return btoa(String.fromCharCode(...new Uint8Array(input)))
        .replace(/=/g, "")
        .replace(/\+/g, "-")
        .replace(/\//g, "_");
    }

    async function redirectToSpotifyLogin() {
      if (CLIENT_ID === "YOUR_CLIENT_ID_HERE") {
        alert("Please edit index.html and paste your Spotify Client ID first!");
        return;
      }
      const codeVerifier = generateRandomString(64);
      const hashed = await sha256(codeVerifier);
      const codeChallenge = base64encode(hashed);
      localStorage.setItem("code_verifier", codeVerifier);

      const authUrl = new URL("https://accounts.spotify.com/authorize");
      authUrl.search = new URLSearchParams({
        response_type: "code",
        client_id: CLIENT_ID,
        scope: SCOPES,
        code_challenge_method: "S256",
        code_challenge: codeChallenge,
        redirect_uri: REDIRECT_URI,
      }).toString();

      window.location.href = authUrl.toString();
    }

    async function exchangeToken(code) {
      const codeVerifier = localStorage.getItem("code_verifier");
      const response = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: "authorization_code",
          code: code,
          redirect_uri: REDIRECT_URI,
          code_verifier: codeVerifier,
        }),
      });
      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem("sp_token", data.access_token);
        window.history.replaceState({}, document.title, REDIRECT_URI);
        return data.access_token;
      }
      return null;
    }

    document.getElementById("authBtn").addEventListener("click", redirectToSpotifyLogin);

    let player, deviceId, durationMs = 0, positionMs = 0, isPaused = true;

    function formatTime(ms) {
      const totalSec = Math.floor(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = totalSec % 60;
      return `${min}:${sec < 10 ? "0" : ""}${sec}`;
    }

    setInterval(() => {
      if (!isPaused && durationMs > 0) {
        positionMs = Math.min(positionMs + 500, durationMs);
        document.getElementById("progressFill").style.width = (positionMs / durationMs) * 100 + "%";
        document.getElementById("curTime").textContent = formatTime(positionMs);
      }
    }, 500);

    window.onSpotifyWebPlaybackSDKReady = async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get("code");
      let token = localStorage.getItem("sp_token");

      if (code) {
        token = await exchangeToken(code);
      }
      if (!token) return;

      document.getElementById("authBtn").textContent = "Reconnect";

      player = new Spotify.Player({
        name: "Frutiger Aero Player",
        getOAuthToken: cb => cb(token),
        volume: 0.85
      });

      player.addListener("ready", ({ device_id }) => {
        deviceId = device_id;
        document.getElementById("statusDot").classList.add("connected");
        document.getElementById("trackTitle").textContent = "Aero Player Online!";
        document.getElementById("trackArtist").textContent = "Select this device in Spotify";
      });

      player.addListener("authentication_error", () => {
        localStorage.removeItem("sp_token");
        document.getElementById("statusMsg").textContent = "Session expired. Tap Connect Spotify again.";
      });

      player.addListener("player_state_changed", state => {
        if (!state) return;
        const track = state.track_window.current_track;
        document.getElementById("trackTitle").textContent = track.name;
        document.getElementById("trackArtist").textContent = track.artists.map(a => a.name).join(", ");
        const imgUrl = track.album.images && track.album.images[0] ? track.album.images[0].url : "";
        const imgEl = document.getElementById("albumArt");
        const phEl = document.getElementById("albumPlaceholder");
        if (imgUrl) {
          imgEl.src = imgUrl;
          imgEl.style.display = "block";
          phEl.style.display = "none";
        } else {
          imgEl.style.display = "none";
          phEl.style.display = "flex";
        }

        isPaused = state.paused;
        positionMs = state.position;
        durationMs = state.duration;
        document.getElementById("playBtn").textContent = isPaused ? "▶" : "⏸";
        document.getElementById("durTime").textContent = formatTime(durationMs);

        if ("mediaSession" in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: track.name,
            artist: track.artists.map(a => a.name).join(", "),
            album: track.album.name,
            artwork: imgUrl ? [{ src: imgUrl, sizes: "512x512", type: "image/jpeg" }] : []
          });
          navigator.mediaSession.setActionHandler("play", () => player.resume());
          navigator.mediaSession.setActionHandler("pause", () => player.pause());
          navigator.mediaSession.setActionHandler("previoustrack", () => player.previousTrack());
          navigator.mediaSession.setActionHandler("nexttrack", () => player.nextTrack());
        }
      });

      document.getElementById("playBtn").onclick = () => {
        player.activateElement();
        player.togglePlay();
      };
      document.getElementById("prevBtn").onclick = () => player.previousTrack();
      document.getElementById("nextBtn").onclick = () => player.nextTrack();

      document.getElementById("progressBar").onclick = (e) => {
        if (!durationMs) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const ratio = (e.clientX - rect.left) / rect.width;
        player.seek(Math.floor(ratio * durationMs));
      };

      player.connect();
    };
  </script>
</body>
</html>
